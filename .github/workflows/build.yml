name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # No Gradle wrapper is committed (nothing is built locally), so CI provides Gradle directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.0"

      - name: Unit tests
        run: gradle testGithubDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleGithubDebug assemblePlayDebug --stacktrace

      # Room exports the DB schema during compilation; it must be committed for future migrations.
      - name: Check Room schema is committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git status --porcelain app/schemas
            echo "::error::Room schema in app/schemas changed but is not committed. Download the 'room-schemas' artifact and commit it."
            exit 1
          fi

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: safemoney-debug-${{ github.sha }}
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
